<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
		<meta http-equiv="Pragma" content="no-cache" />
		<meta http-equiv="cache-Control" content="no-cache, must-revalidate" />
		<meta http-equiv="Expires" content="Mon, 26 Jul 1997 05:00:00 GMT" />
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>404 - Page Not Found</title>

		<link rel="stylesheet" type="text/css" href="/errors/assets/css/errors.css" />
		<script type="text/javascript" src="/assets/script/jquery/jquery.js"></script>
				<script type="text/javascript">
			$(function() {
				$.get('/model_string.txt', function(textData, status) {
					var modelNo = textData;
					$('.productName').html(modelNo); 
				}, 'text');
			});
		</script>
	</head>
	<body class="error_page">
		<div id="container">
			<div id="container_inner">
				<div id="header">
					<div id="header_inner">
						<a id="carrier_logo" href="/">
							<img src="/assets/images/logos/header_logo.png" alt="Inseego" />
						</a>
						<h3 class="productName">FX3100-1</h3>
					</div>
				</div><!-- end of header -->
				<div id="main" role="main" class="clearfix">
					<div id="main_inner">
						<div id="app_container">
							<div id="app_inner">
								<div id="app_content">
									<h2>Page Not Found</h2>
									<p>Sorry, but the page you are looking for has not been found. Try checking the URL for errors, then hit the refresh button on your browser.</p>
									<a class="gohome" href="/">Take me home</a>
								</div>
							</div>
						</div> <!-- /#app_container -->

					</div>  <!-- /#main_inner -->
				</div> <!-- /#main -->

			</div> <!-- /#container_inner -->
			<div id="push"></div> <!-- for sticky footer -->
		</div> <!-- /#container -->

		<div id="footer" class="footer">
			<div class="footer_inner">
				<div class="col logo_device" class="logoDevice">
					<a id="inseegoLogo" href="http://www.inseego.com/" title="Inseego" target="_blank">
						<img src="/assets/images/logos/footer_logo.png" alt="Inseego" />
					</a>
				</div><!-- /.logo_device -->
				<div class="col copyright">
					<p>&copy; <span id="copyYear"></span> All rights reserved.</p>
				</div><!-- /.copyright -->
				<div class="col mifi_device">
					<p id="powered">
						<a id="inseegoUrl" href="http://www.inseego.com/" title="InseegoUrl" target="_blank">
							www.inseego.com
						</a>
					</p>
				</div>			
			</div><!-- /.footer_inner -->
		</div><!-- /.footer -->
		
	</body>
	<script type="text/javascript">	
		var currentYear = new Date().getFullYear();
		$("#copyYear").html(currentYear);
	</script>	
</html>
